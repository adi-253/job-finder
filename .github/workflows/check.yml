name: Check for new jobs

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      seed:
        description: "Record all current jobs as seen without alerting"
        type: boolean
        default: false

concurrency:
  group: job-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # State (every job ID seen so far) lives on a separate `state` branch that is
      # force-pushed each run, so it never bloats the main branch's history.
      - name: Load state
        run: |
          git fetch --depth=1 origin state && git show origin/state:state.json > state.json \
            || echo "No saved state yet - first run records current jobs silently."

      - name: Find jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py ${{ inputs.seed && '--seed' || '' }}

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=$(mktemp -d) && cp state.json "$dir/" && cd "$dir"
          git init -q -b state
          git add state.json
          git -c user.name=job-finder -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm state
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" state

      # Matches are appended to history.jsonl on main: a log of every alert, and the
      # commits keep the repo "active" so GitHub doesn't pause the schedule after 60 days.
      - name: Commit history
        run: |
          git config user.name "job-finder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain history.jsonl)" ]; then
            git add history.jsonl && git commit -qm "New matching jobs"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git commit -q --allow-empty -m "keepalive"   # no commits for 30 days
          else
            exit 0
          fi
          git pull -q --rebase && git push -q
