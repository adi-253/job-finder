# ─────────────────────────────────────────────────────────────────────────────
# Job finder config. Add a company = add one line under `companies`.
#   source: greenhouse | lever | ashby | smartrecruiters  →  needs `slug`
#           oracle_hcm                                    →  needs host, site (from the careers URL)
#           workday                                       →  needs tenant, dc, site
#           google | amazon | microsoft | apple | atlassian | rippling | intuit | goldman
# Find a company's source by opening one of its job pages: the URL usually shows it
# (boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>,
#  jobs.smartrecruiters.com/<slug>, <tenant>.<dc>.myworkdayjobs.com/<site>).
# Set `disabled: true` to switch a company off.
# ─────────────────────────────────────────────────────────────────────────────

workers: 12

filters:
  max_years: 2   # reject jobs whose description asks for more than this many years

  locations:     # job location must match one of these (case-insensitive regex)
    - \bindia\b
    - bengaluru
    - bangalore
    - hyderabad
    - \bpune\b
    - gurugram
    - gurgaon
    - noida
    - chennai
    - mumbai
    - delhi
    - kolkata
    - ahmedabad
    - kochi
    - jaipur
    - mohali
    - chandigarh
    - coimbatore
    - thiruvananthapuram
    - trivandrum
    - indore

  title_include: # title must match one of these…
    - software
    - \bsde\b
    - \bsdet\b
    - \bswe\b
    - developer
    - programmer
    - member\s+(of\s+)?(the\s+)?technical\s+staff
    - \bmts\b
    - \bamts\b
    - full[\s-]?stack
    - front[\s-]?end
    - back[\s-]?end
    - \b(platform|ml|ai|machine learning|data|mobile|android|ios|web|cloud|infrastructure|infra|systems?|application|product|devops|site reliability|reliability|security|qa|test|automation|java|python|golang|go|forward deployed|graduate|associate|junior|new grad|distributed systems|database|compiler|kernel)\s+engineer
    - \bengineer\s*-?\s*(i|1)\b
    - new\s+grad
    - graduate
    - university

  title_exclude: # …and none of these
    - \bsenior\b
    - \bsr\b\.?
    - (?<!technical\s)\bstaff\b      # but keep "Member of Technical Staff"
    - \bprincipal\b
    - \blead\b
    - \bleader\b
    - manager
    - \bmgr\b
    - \bmgmt\b
    - \bavp\b                # Assistant Vice President (banks): mid/senior
    - technical\s+account
    - \bmanagement\b
    - architect
    - director
    - \bhead\b
    - \bvp\b
    - vice\s+president
    - distinguished
    - \bfellow\b
    - \bintern(ship)?\b
    - \b(ii|iii|iv)\b
    - (engineer|developer|sde|swe|sdet|engineering)\s*-?\s*[2-9]\b
    - \bic[3-9]\b
    - \b(smts|lmts|pmts)\b
    - \bsme\b
    - \bexpert\b
    - \bsales\s+(engineer|executive|representative|associate|specialist)\b   # not "Sales Engineering" team names
    - pre-?sales
    - account\s+(executive|manager)
    - solutions?\s+(engineer|architect|consultant)
    - support
    - customer
    - consultant
    - recruit
    - hardware
    - \basic\b
    - \bdft\b
    - physical\s+design
    - analog
    - silicon
    - verification
    - \bpcb\b
    - mechanical
    - electrical
    - technician
    - teacher|tutor|faculty

companies:
